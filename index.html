<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Budget formation : ton parcours pas à pas</title>
<meta name="description" content="Parcours interactif pour construire une application Budget formation avec Claude et Apps Script, tout en analysant les usages de l'IA en RH.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8FAFC; --surface:#FFFFFF; --ink:#0F172A; --ink2:#475569; --ink3:#64748B;
  --line:#E2E8F0; --line2:#CBD5E1;
  --accent:#059669; --accent-ink:#065F46; --accent-soft:#ECFDF5; --accent-line:#A7F3D0;
  --blue:#2563EB; --blue-soft:#EFF6FF;
  --warn:#B45309; --warn-soft:#FFFBEB; --warn-line:#FDE68A;
  --danger:#B91C1C; --danger-soft:#FEF2F2; --danger-line:#FECACA;
  --glass:rgba(255,255,255,.72);
  --radius:10px;
  --font-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-head:"Bricolage Grotesque","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-head);line-height:1.2;margin:0;color:var(--ink)}
h1{font-size:1.7rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:650}
h3{font-size:1.1rem;font-weight:650}
p{margin:0 0 .8em;max-width:68ch}
a{color:var(--blue)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
kbd{font-family:var(--mono);font-size:.72rem;background:var(--bg);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--ink2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* barre d'actions flottante */
.bar{position:sticky;top:10px;z-index:30;margin:10px 14px 0;padding:8px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--glass);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 2px rgba(15,23,42,.05)}
.bar .actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:.92rem;cursor:pointer;line-height:1.2}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.small{padding:4px 9px;font-size:.84rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.bar .brand{font-family:var(--font-head);font-weight:700;margin-left:auto;color:var(--ink2);font-size:.95rem}
.status{font-size:.85rem;color:var(--ink3);display:flex;gap:12px;flex-wrap:wrap}
.status b{color:var(--ink2);font-weight:600}
.status .warn{color:var(--warn);font-weight:600}

/* grille */
.app{display:grid;grid-template-columns:250px minmax(0,1fr) 330px;gap:16px;padding:16px 14px 60px;align-items:start}
@media (max-width:1180px){.app{grid-template-columns:minmax(0,1fr)}.rail{position:static!important}.dash{position:static!important}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.card+.card{margin-top:14px}

/* rail */
.rail{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto}
.rail h2{font-size:.95rem;margin:0 0 10px;color:var(--ink2)}
.chap{margin:0 0 12px}
.chap-title{font-weight:700;font-size:.9rem;margin:0 0 4px;color:var(--ink)}
.chap ol{list-style:none;margin:0;padding:0}
.step-link{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;padding:5px 6px;border-radius:7px;cursor:pointer;font-size:.9rem;color:var(--ink2)}
.step-link:hover{background:var(--bg)}
.step-link[aria-current="step"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:650}
.step-link[disabled]{opacity:.45;cursor:not-allowed}
.dot{flex:none;width:12px;height:12px;border-radius:50%;border:2px solid var(--line2);background:#fff}
.dot.done{background:var(--accent);border-color:var(--accent)}
.dot.new{border-color:var(--warn);background:var(--warn-soft)}

/* stage */
.stage .eyebrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.chip{display:inline-block;font-size:.8rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--line2);color:var(--ink2)}
.chip.obj{background:var(--blue-soft);border-color:#BFDBFE;color:#1D4ED8}
.chip.warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.chip.ok{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-ink)}
.chip.bad{background:var(--danger-soft);border-color:var(--danger-line);color:var(--danger)}
.lead{color:var(--ink2);font-size:1.02rem}
.stage h1{margin-bottom:6px}
.box{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;background:var(--bg);margin:12px 0}
.box.info{background:var(--blue-soft);border-color:#BFDBFE}
.box.warn{background:var(--warn-soft);border-color:var(--warn-line)}
.box.ok{background:var(--accent-soft);border-color:var(--accent-line)}
.box.bad{background:var(--danger-soft);border-color:var(--danger-line)}
.box h3{font-size:1rem;margin-bottom:4px}
.box p:last-child{margin-bottom:0}

/* missions */
.todo{list-style:none;margin:14px 0;padding:0;display:grid;gap:12px}
.todo>li{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;background:var(--surface)}
.todo>li.checked{background:var(--accent-soft);border-color:var(--accent-line)}
.todo label{display:flex;gap:10px;align-items:flex-start;font-weight:650;cursor:pointer}
.todo input[type=checkbox]{width:20px;height:20px;margin-top:3px;accent-color:var(--accent);flex:none}
.todo .detail{margin:8px 0 0 30px;color:var(--ink2);font-size:.97rem}
.todo .detail p{margin-bottom:.5em}
.fig{margin:10px 0 4px 30px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:8px;max-width:680px}
.fig svg{display:block;width:100%;height:auto}
.fig img{display:none;width:100%;height:auto;border-radius:6px}
.fig figcaption{font-size:.84rem;color:var(--ink3);padding:6px 4px 0}
.fig figcaption ol{margin:4px 0 0;padding-left:18px}
.fig .tag{font-size:.75rem;color:var(--ink3)}
.copy{margin:8px 0 0 30px;border:1px solid var(--line2);border-radius:8px;background:var(--bg);overflow:hidden}
.copy header{display:flex;justify-content:space-between;align-items:center;padding:5px 8px 5px 12px;border-bottom:1px solid var(--line);font-size:.82rem;color:var(--ink3);font-weight:600}
.copy pre{margin:0;padding:10px 12px;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:.84rem;line-height:1.5;color:var(--ink)}

/* choix */
.q{font-size:1.08rem;font-weight:650;margin:14px 0 8px;font-family:var(--font-head)}
.opts{display:grid;gap:10px;margin:8px 0}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line2);background:var(--surface);border-radius:var(--radius);padding:12px 14px;cursor:pointer}
.opt:hover{border-color:var(--ink3)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .rad{flex:none;width:18px;height:18px;margin-top:3px;border-radius:50%;border:2px solid var(--line2);background:#fff}
.opt[aria-pressed="true"] .rad{border-color:var(--accent);background:radial-gradient(var(--accent) 45%,#fff 50%)}
.opt strong{display:block;font-weight:650}
.opt span.d{display:block;color:var(--ink2);font-size:.95rem}
.locked .opt{cursor:default}
.locked .opt:not([aria-pressed="true"]){opacity:.55}
.opts.row{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}

.usage{border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:12px 0;background:var(--surface)}
.usage h3{margin-bottom:4px}
.usage .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0;font-size:.93rem}
.usage .two div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
@media (max-width:640px){.usage .two{grid-template-columns:1fr}}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.seg button{border:1.5px solid var(--line2);background:#fff;border-radius:8px;padding:6px 11px;font-weight:600;font-size:.9rem;cursor:pointer}
.seg button:hover{border-color:var(--ink3)}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.locked .seg button{cursor:default}
.locked .seg button:not([aria-pressed="true"]){opacity:.5}
.verdict{margin-top:8px;font-size:.93rem;border-radius:8px;padding:8px 10px}
.verdict.ok{background:var(--accent-soft);border:1px solid var(--accent-line)}
.verdict.no{background:var(--warn-soft);border:1px solid var(--warn-line)}

.explore{display:grid;gap:6px;margin:8px 0}
.explore label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;font-size:.95rem}
.explore input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent);flex:none}
.explore small{display:block;color:var(--ink3)}
textarea,input[type=text]{width:100%;font:inherit;border:1.5px solid var(--line2);border-radius:8px;padding:9px 11px;background:#fff;color:var(--ink)}
textarea{min-height:92px;resize:vertical}
textarea:disabled,input[type=text]:disabled{background:var(--bg);color:var(--ink2)}
.field{margin:10px 0}
.field label{display:block;font-weight:650;margin-bottom:4px;font-size:.95rem}
.count{font-size:.82rem;color:var(--ink3);margin-top:2px}
.count.ok{color:var(--accent-ink)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}

.deltas{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.delta{font-size:.82rem;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid var(--line2);background:#fff}
.delta.p{color:var(--accent-ink);border-color:var(--accent-line);background:var(--accent-soft)}
.delta.n{color:var(--danger);border-color:var(--danger-line);background:var(--danger-soft)}
.delta.z{color:var(--ink3)}

/* feuille de route */
.act{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin:10px 0;background:#fff}
.act.must{border-color:var(--warn-line);background:var(--warn-soft)}
.act .cat{font-size:.78rem;font-weight:700;color:var(--ink3)}
.act .t{font-weight:600;margin:2px 0 6px}
.checks{list-style:none;padding:0;margin:8px 0;display:grid;gap:4px;font-size:.93rem}
.checks li::before{content:"○ ";color:var(--ink3)}
.checks li.ok::before{content:"✓ ";color:var(--accent);font-weight:700}

/* tableau de bord */
.dash{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto;background:var(--glass);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.dash h2{font-size:1rem;margin-bottom:8px}
.dash section+section{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.gauge{margin:8px 0}
.gauge .lab{display:flex;justify-content:space-between;font-size:.88rem;font-weight:600}
.gauge .lab span{font-family:var(--mono);font-weight:500;color:var(--ink2)}
.track{height:9px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:3px}
.fill{height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}
.fill.mid{background:var(--warn)}
.fill.low{background:var(--danger)}
.path{overflow-x:auto;padding-bottom:4px}
.path svg{display:block}
.journal{list-style:none;margin:0;padding:0;font-size:.86rem;display:grid;gap:6px;max-height:210px;overflow:auto}
.journal li{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff}
.journal b{display:block;font-weight:650}
.hint{font-size:.82rem;color:var(--ink3)}
.banner{margin:12px 14px 0}

/* impression : seule la vue rapport est imprimée */
#print-root{display:none}
@media print{
  body{background:#fff;font-size:11.5pt}
  .bar,.app,.banner,.toast{display:none!important}
  #print-root{display:block;padding:0}
  #print-root h1{font-size:20pt}
  #print-root h2{font-size:14pt;margin:16pt 0 6pt;border-bottom:1px solid #999;padding-bottom:3pt;break-after:avoid}
  #print-root h3{font-size:11.5pt;margin:8pt 0 2pt}
  #print-root table{border-collapse:collapse;width:100%;margin:6pt 0}
  #print-root th,#print-root td{border:1px solid #bbb;padding:3pt 5pt;text-align:left;vertical-align:top;font-size:10pt}
  #print-root .blk{break-inside:avoid;margin:0 0 6pt}
  #print-root pre{white-space:pre-wrap;font-family:var(--mono);font-size:9.5pt;border:1px solid #bbb;padding:5pt}
  #print-root .bar-i{display:inline-block;height:7pt;background:#059669}
  @page{margin:16mm}
}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-size:.92rem;z-index:50;box-shadow:0 6px 24px rgba(15,23,42,.25)}
dialog{border:1px solid var(--line2);border-radius:var(--radius);padding:20px;max-width:520px;width:calc(100% - 32px);background:#fff;color:var(--ink)}
dialog::backdrop{background:rgba(15,23,42,.35);backdrop-filter:blur(3px)}
dialog h2{margin-bottom:8px}
dialog .nav{margin-top:14px}
table.simple{border-collapse:collapse;width:100%;font-size:.93rem;margin:8px 0}
table.simple th,table.simple td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
table.simple th{background:var(--bg)}
details{border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;background:#fff;margin:10px 0}
details summary{cursor:pointer;font-weight:650}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

@media print{#print-root .bar-i{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

</style>
</head>
<body>
<a class="sr" href="#stage">Aller au contenu</a>
<header class="bar" role="banner">
  <div class="actions" role="toolbar" aria-label="Actions du projet">
    <button class="btn" data-act="new" title="Nouveau projet">Nouveau <kbd data-pc="Alt N" data-mac="⌥ N">Alt N</kbd></button>
    <button class="btn" data-act="open" title="Ouvrir un fichier de projet">Ouvrir <kbd data-pc="Alt O" data-mac="⌥ O">Alt O</kbd></button>
    <button class="btn primary" data-act="exportJson" title="Enregistrer un fichier de projet (.json)">Enregistrer <kbd data-pc="Ctrl S" data-mac="⌘ S" style="color:#065F46">Ctrl S</kbd></button>
    <button class="btn" data-act="exportPdf" title="Exporter le rapport en PDF">Exporter PDF <kbd data-pc="Ctrl E" data-mac="⌘ E">Ctrl E</kbd></button>
  </div>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="brand">Budget formation</div>
</header>
<div class="app">
  <nav class="rail card" aria-label="Étapes du parcours"><h2>Ton parcours</h2><div id="rail-list"></div></nav>
  <main class="stage" id="stage" tabindex="-1"></main>
  <aside class="dash" id="dash" aria-label="Tableau de bord"></aside>
</div>
<div id="print-root"></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<dialog id="dlg" aria-modal="true"></dialog>
<script>
/* ===== Outils ===== */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NB=' ',NNB=' ';
const frText=t=>t.replace(/ ([:;?!»%€])/g,NB+'$1').replace(/« /g,'«'+NB).replace(/(\d) (?=\d{3}(?!\d))/g,'$1'+NNB);
const fr=html=>html.replace(/^([^<]+)/,m=>frText(m)).replace(/>([^<]+)</g,(m,t)=>'>'+frText(t)+'<');
const wc=s=>(String(s||'').trim().match(/\S+/g)||[]).length;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const uid=()=>Math.random().toString(36).slice(2,10);
const KEY='parcours-budget-formation-v1';
const APPID='parcours-budget-formation';
const VERSION=1;

/* ===== État ===== */
function fresh(){return {app:APPID,v:VERSION,id:uid(),meta:{created:Date.now(),updated:Date.now(),lastJson:0,lastPdf:0,changes:0},cur:'accueil',ans:{}};}
let S=fresh();
let storageOK=true;
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);if(o&&o.app===APPID&&o.ans)return o;}}catch(e){storageOK=false;}return null;}
function persist(){S.meta.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true;}catch(e){storageOK=false;}}
const A=id=>S.ans[id]||(S.ans[id]={});

/* ===== Étapes ===== */
const have=(f,k)=>f.has(k);
const STEPS=[
 {id:'accueil',kind:'accueil',chap:'c0',t:'Bienvenue'},
 {id:'m1',kind:'mission',chap:'c1',t:'Régler Claude'},
 {id:'m2',kind:'mission',chap:'c1',t:'Créer le projet dédié'},
 {id:'m3',kind:'mission',chap:'c1',t:'Créer la feuille et le script'},
 {id:'d1',kind:'perimetre',chap:'c2',t:'Choisir ton périmètre RH'},
 {id:'d2',kind:'usages',mode:'adopt',chap:'c3',obj:1,t:'Ce que l’IA change'},
 {id:'d3',kind:'usages',mode:'human',chap:'c3',obj:2,t:'Qui décide : l’IA ou l’humain',show:f=>f.has('hasret')},
 {id:'d4',kind:'usages',mode:'qualif',chap:'c3',obj:3,t:'Qualifier chaque usage'},
 {id:'sc_interdit',kind:'scene',chap:'c4',scene:'sc_interdit',show:f=>SCENES[0].cond(f)},
 {id:'d5',kind:'garde',chap:'c4',obj:4,t:'Données, biais, transparence, CSE'},
 {id:'sc_donnees',kind:'scene',chap:'c4',scene:'sc_donnees',show:f=>SCENES[1].cond(f)},
 {id:'sc_cse',kind:'scene',chap:'c4',scene:'sc_cse',show:f=>SCENES[2].cond(f)},
 {id:'sc_biais',kind:'scene',chap:'c4',scene:'sc_biais',show:f=>SCENES[3].cond(f)},
 {id:'sc_transp',kind:'scene',chap:'c4',scene:'sc_transp',show:f=>SCENES[4].cond(f)},
 {id:'m4',kind:'mission',chap:'c5',t:'Construire « Budget formation »'},
 {id:'d6',kind:'roadmap',chap:'c6',obj:5,t:'Construire ta feuille de route'},
 {id:'d7',kind:'synthese',chap:'c7',obj:6,t:'Diagnostic et défense'}
];
const stepById=id=>STEPS.find(s=>s.id===id);
const sceneOf=st=>SCENES.find(x=>x.id===st.scene);
const titleOf=st=>st.scene?sceneOf(st).t:st.t;
const perimetreId=()=>(S.ans.d1&&S.ans.d1.done)?S.ans.d1.choice:null;
const usagesList=()=>USAGES[perimetreId()]||[];
const usageById=id=>usagesList().find(u=>u.id===id);

/* ===== Calcul de l'état dérivé ===== */
function stepFlags(st,a,f){
  if(st.kind==='perimetre'){f.add('perimetre:'+a.choice);}
  else if(st.kind==='scene'){const o=sceneOf(st).opts.find(x=>x.id===a.choice);if(o)(o.flags||[]).forEach(x=>f.add(x));}
  else if(st.kind==='garde'){GARDE.forEach(g=>{const o=g.opts.find(x=>x.id===(a.pick||{})[g.id]);if(o)o.flags.forEach(x=>f.add(x));});}
  else if(st.kind==='usages'){
    const ul=usagesList(),p=a.pick||{};
    if(st.mode==='adopt'){ul.forEach(u=>{const c=p[u.id];if(c==='adopt'||c==='pilote'){f.add('hasret');f.add('ret:'+u.id);if(u.ref==='interdit')f.add('interdit_retenu');if(u.ref==='haut')f.add('haut_retenu');if(c==='pilote')f.add('pilote_present');}});}
    if(st.mode==='human'){ul.forEach(u=>{const m=p[u.id];if(m){f.add('mode:'+m);if(m==='seule'&&(u.ref==='haut'||u.ref==='interdit'))f.add('seule_haut');}});}
    if(st.mode==='qualif'){ul.forEach(u=>{if(p[u.id]&&p[u.id]!==u.ref)f.add('qualif_err:'+u.id);});}
  }
}
function addFx(t,f){for(const k in f)t[k]=(t[k]||0)+f[k];return t;}
function retained(u){const a=S.ans.d2;return a&&a.done&&(a.pick[u.id]==='adopt'||a.pick[u.id]==='pilote');}
function stepFx(st,a,flags){
  const t={valeur:0,legal:0,conf:0,qvct:0,sob:0};
  if(st.kind==='perimetre')return t;
  if(st.kind==='scene'){const o=sceneOf(st).opts.find(x=>x.id===a.choice);return o?addFx(t,o.fx):t;}
  if(st.kind==='garde'){GARDE.forEach(g=>{const o=g.opts.find(x=>x.id===(a.pick||{})[g.id]);if(o)addFx(t,o.fx);});return t;}
  if(st.kind==='usages'){
    const ul=usagesList(),p=a.pick||{};
    ul.forEach(u=>{
      if(st.mode==='adopt'&&p[u.id])addFx(t,u.fx[p[u.id]]);
      if(st.mode==='human'&&p[u.id]&&retained(u))addFx(t,HUMAN_FX[p[u.id]][u.ref]);
      if(st.mode==='qualif'&&p[u.id])addFx(t,fx(0,p[u.id]===u.ref?3:-3,0,0,0));
    });return t;}
  if(st.kind==='roadmap'){ACTIONS.forEach(ac=>{const h=(a.pick||{})[ac.id];if(h&&HFACTOR[h])addFx(t,{valeur:ac.fx.valeur*HFACTOR[h],legal:ac.fx.legal*HFACTOR[h],conf:ac.fx.conf*HFACTOR[h],qvct:ac.fx.qvct*HFACTOR[h],sob:ac.fx.sob*HFACTOR[h]});});return t;}
  return t;
}
function derive(){
  const flags=new Set();
  STEPS.forEach(st=>{const a=S.ans[st.id];if(a&&a.done)stepFlags(st,a,flags);});
  const tot={valeur:0,legal:0,conf:0,qvct:0,sob:0},per={};
  STEPS.forEach(st=>{const a=S.ans[st.id];if(a&&a.done){const f=stepFx(st,a,flags);per[st.id]=f;addFx(tot,f);}});
  const ind={};IND.forEach(i=>ind[i.k]=clamp(Math.round(50+(tot[i.k]||0)),0,100));
  const visible=STEPS.filter(s=>!s.show||s.show(flags));
  return {flags,tot,per,ind,visible};
}
function isDone(st){const a=S.ans[st.id];return !!(a&&a.done);}
function openableIndex(vis){const i=vis.findIndex(s=>!isDone(s));return i<0?vis.length-1:i;}

function rulesFromPath(f){

/* figure HTML : le schéma dessiné, remplacé par ta capture si le fichier captures/<id>.png existe */
function figureHtml(id){
  const d=SCHEMAS[id]; if(!d) return '';
  const caps=d.cap.map(c=>`<li>${esc(c)}</li>`).join('');
  return `<figure class="fig" data-fig="${id}">${sSvg(d.svg(),d.alt)}<img src="captures/${id}.png" alt="${esc(d.alt)} (capture)" onload="this.style.display='block';this.parentNode.querySelector('svg').style.display='none';">`+
    `<figcaption><span class="tag">Schéma simplifié, pas une capture : l’écran peut varier selon ta formule ou la version.</span><ol>${caps}</ol></figcaption></figure>`;
}

/* ===== Interface ===== */
const $=s=>document.querySelector(s);
const SHORT={valeur:'Gain',legal:'Conformité',conf:'Confiance',qvct:'QVCT',sob:'Sobriété'};
const JUST={perimetre:12,adopt:15,human:15,qualif:15,garde:20,scene:8,roadmap:20};
let D=null; /* état dérivé courant */

function toast(msg){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3200);}
function fmtTime(ts){if(!ts)return null;try{return new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(ts));}catch(e){return new Date(ts).toLocaleString();}}
function deltaChips(f){
  if(!f)return '';
  return '<div class="deltas" aria-label="Effets de cette décision">'+IND.map(i=>{const v=Math.round(f[i.k]||0);const c=v>0?'p':v<0?'n':'z';return `<span class="delta ${c}">${SHORT[i.k]} ${v>0?'+':''}${v}</span>`;}).join('')+'</div>';
}
function chipsFor(st){
  const ch=CHAPS.find(c=>c.id===st.chap);let h=`<span class="chip">${esc(ch.t)}</span>`;
  if(st.obj)h+=`<span class="chip obj" title="${esc(OBJ[st.obj])}">Objectif ${st.obj}</span>`;
  if(st.scene)h+=`<span class="chip warn">Nouvelle étape : conséquence de tes choix</span><span class="chip obj">Objectif ${sceneOf(st).obj}</span>`;
  return `<div class="eyebrow">${h}</div>`;
}
function objLine(n){return n?`<p class="hint">${esc(OBJ[n])}.</p>`:'';}

/* ----- blocs communs ----- */
function justifBox(st,a,locked,label,min){
  const v=a.justif||'';const n=wc(v);
  return `<div class="field"><label for="j-${st.id}">${esc(label)}</label><textarea id="j-${st.id}" data-field="justif" data-step="${st.id}" ${locked?'disabled':''} placeholder="Écris avec tes mots, en t’appuyant sur ce que tu as lu.">${esc(v)}</textarea><div class="count ${n>=min?'ok':''}" id="cnt-${st.id}">${n} mot${n>1?'s':''} sur ${min} au minimum</div></div>`;
}
function exploreBox(st,a,locked,ids,min){
  const sel=a.sources||[];
  return `<div class="box info"><h3>Avant de décider, explore les textes</h3><p>Ouvre au moins ${min} sources et coche celles que tu as vraiment lues.</p><div class="explore">`+
   ids.map(id=>{const s=SRC[id];return `<label><input type="checkbox" data-act="src" data-step="${st.id}" data-val="${id}" ${sel.includes(id)?'checked':''} ${locked?'disabled':''}><span><a href="${s.u}" target="_blank" rel="noopener">${esc(s.t)}</a><small>${esc(s.w)}</small></span></label>`;}).join('')+
   `</div><p class="hint">${esc(SRC_NOTE)}</p></div>`;
}
function commitZone(st,locked,label){
  if(locked)return `<div class="commitzone" id="commitzone"></div>`;
  const m=unmet(st);
  return `<div class="commitzone" id="commitzone"><div class="nav"><span></span><button class="btn primary" data-act="commit" data-step="${st.id}" ${m.length?'disabled':''}>${esc(label||'Valider ma décision')}</button></div>`+
   (m.length?`<ul class="checks">${m.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="hint">Cette décision t’engage : tu ne pourras plus la modifier.</p>')+`</div>`;
}
function navBar(st,D){
  const vis=D.visible,i=vis.findIndex(s=>s.id===st.id);
  const prev=i>0?`<button class="btn" data-act="goto" data-step="${vis[i-1].id}">Étape précédente</button>`:'<span></span>';
  const can=isDone(st)&&i<vis.length-1;
  const next=i<vis.length-1?`<button class="btn ${can?'primary':''}" data-act="goto" data-step="${vis[i+1].id}" ${can?'':'disabled'}>Étape suivante</button>`:'<span></span>';
  return `<div class="nav">${prev}${next}</div>`;
}

/* ----- validations ----- */
function unmet(st){
  const a=A(st.id),m=[];const j=wc(a.justif);
  const need=(min,l)=>{if(j<min)m.push(`${l} (${j} mots sur ${min}).`);};
  if(st.kind==='accueil'){if(!(a.pseudo||'').trim())m.push('Écris un pseudo ou un nom d’équipe.');}
  else if(st.kind==='perimetre'){if(!a.choice)m.push('Choisis un périmètre.');need(JUST.perimetre,'Explique ton choix');}
  else if(st.kind==='scene'){if(!a.choice)m.push('Choisis une réponse.');need(JUST.scene,'Explique ta décision');}
  else if(st.kind==='usages'){
    const ul=st.mode==='human'?usagesList().filter(retained):usagesList();const p=a.pick||{};
    if(st.mode==='human'&&!ul.length)return m;
    const left=ul.filter(u=>!p[u.id]).length;if(left)m.push(`Il reste ${left} usage${left>1?'s':''} à traiter.`);
    if(st.mode==='qualif'&&(a.sources||[]).length<2)m.push('Coche au moins 2 sources lues.');
    need(JUST[st.mode],'Explique ton raisonnement');
  }
  else if(st.kind==='garde'){const p=a.pick||{};const left=GARDE.filter(g=>!p[g.id]).length;if(left)m.push(`Il reste ${left} question${left>1?'s':''} à trancher.`);if((a.sources||[]).length<2)m.push('Coche au moins 2 sources lues.');need(JUST.garde,'Explique ton raisonnement');}
  else if(st.kind==='roadmap'){roadmapChecks(a).forEach(c=>{if(!c.ok)m.push(c.t);});need(JUST.roadmap,'Explique l’ordre de tes actions');}
  else if(st.kind==='synthese'){SYN_FIELDS.forEach(f=>{const n=wc((a.fields||{})[f.k]);if(n<f.min)m.push(`${f.t} : ${n} mots sur ${f.min}.`);});}
  return m;
}
function refreshCommit(st){
  const z=$('#commitzone');if(!z)return;const a=A(st.id);if(a.done)return;
  const label=st.kind==='synthese'?'Valider mon diagnostic':st.kind==='roadmap'?'Valider ma feuille de route':'Valider ma décision';
  z.outerHTML=fr(st.kind==='accueil'?commitZoneSimple(st,'Commencer le parcours'):commitZone(st,false,label));
  const c=$('#cnt-'+st.id);if(c){const n=wc(a.justif),min=JUST[st.kind==='usages'?st.mode:st.kind==='perimetre'?'perimetre':st.kind==='scene'?'scene':st.kind]||0;c.textContent=`${n} mot${n>1?'s':''} sur ${min} au minimum`;c.className='count '+(n>=min?'ok':'');}
}

/* ----- accueil ----- */
function renderAccueil(st){
  const a=A(st.id);
  return `${chipsFor(st)}<h1>Budget formation : ton parcours pas à pas</h1>
  <p class="lead">Tu construis une application et, en même temps, tu décides comme un(e) futur(e) DRH. Chaque décision a des conséquences. Ton chemin ne ressemblera pas à celui de ton voisin.</p>
  <div class="field"><label for="pseudo">Ton pseudo ou le nom de ton équipe</label><input type="text" id="pseudo" data-field="pseudo" value="${esc(a.pseudo||'')}" ${a.done?'disabled':''} autocomplete="off" placeholder="Un pseudo suffit : pas de nom réel"></div>
  <div class="box info"><h3>Comment ça marche</h3><ul><li>Des <b>missions techniques</b> te guident clic par clic : Claude, Google Sheets, Apps Script.</li><li>Des <b>décisions RH</b> te demandent de choisir, de justifier et de lire les textes (AI Act, RGPD, Code du travail).</li><li>Une décision validée t’<b>engage</b> : elle change tes indicateurs et ouvre ou ferme des étapes.</li><li>À la fin, tu présentes un <b>diagnostic</b> et un plan d’action.</li></ul></div>

  if(st.mode==='human'){head='Qui décide vraiment ?';intro='Pour chaque usage retenu, choisis qui prend la décision finale. Le mode de décision change tes risques et ta conformité.';}

    if(st.mode==='human')ctrl=HUMAN_MODES.map(c=>`<button data-act="pickU" data-step="${st.id}" data-key="${u.id}" data-val="${c.id}" aria-pressed="${p[u.id]===c.id}" title="${esc(c.d)}">${c.t}</button>`).join('');
    if(st.mode==='qualif')ctrl=QUALIF_LEVELS.map(c=>`<button data-act="pickU" data-step="${st.id}" data-key="${u.id}" data-val="${c.id}" aria-pressed="${p[u.id]===c.id}">${c.t}</button>`).join('');

    if(locked&&st.mode==='adopt'&&p[u.id]==='adopt'&&u.ref==='interdit')ver=`<div class="verdict no">Tu as adopté un usage qui déduit des émotions au travail. Tu verras ce que cela implique plus loin.</div>`;
    const modeHelp=st.mode==='human'?`<div class="two" style="grid-template-columns:1fr"><div><b>Rappel</b> : ${HUMAN_MODES.map(m=>`<b>${m.t}</b> (${m.d})`).join(' ; ')}</div></div>`:'';
    body+=`<div class="usage ${locked?'locked':''}"><h3>${esc(u.t)}</h3><p>${esc(u.s)}</p>${st.mode!=='qualif'?`<div class="two"><div><b>Ce que l’IA apporte</b><br>${esc(u.gain)}</div><div><b>Ce qui reste humain</b><br>${esc(u.humain)}</div></div>`:''}${st.mode==='human'&&u===ul[0]?modeHelp:''}<div class="seg" role="group" aria-label="Ta décision pour ${esc(u.t)}">${ctrl}</div>${ver}</div>`;
  });
  const exp=st.mode==='qualif'?exploreBox(st,a,locked,['aiact','omnibus','cnilia'],2):'';
  const jl={adopt:'Qu’est-ce qui t’a fait pencher, et qu’as-tu pesé ?',human:'Pourquoi ces niveaux de décision humaine ?',qualif:'Qu’as-tu appris dans les textes ? Cite un article.'}[st.mode];
  const calendrier=st.mode==='qualif'&&locked?`<div class="box info"><h3>Calendrier à retenir (à vérifier sur les textes)</h3><ul><li>Pratiques interdites (article 5) : depuis le 2 février 2025.</li><li>Maîtrise de l’IA (article 4) : depuis le 2 février 2025.</li><li>Transparence (article 50) : depuis le 2 août 2026.</li><li>Obligations « haut risque » de l’annexe III, dont l’emploi : 2 décembre 2027, après le règlement (UE) 2026/1744.</li></ul></div>`:'';

/* ----- feuille de route ----- */
function roadmapActions(){return ACTIONS.filter(ac=>!ac.cond||ac.cond(D.flags));}
function roadmapChecks(a){
  const acts=roadmapActions(),p=a.pick||{};const out=[];
  const unplaced=acts.filter(ac=>!p[ac.id]).length;
  out.push({ok:unplaced===0,t:unplaced?`Il reste ${unplaced} action${unplaced>1?'s':''} à placer.`:'Toutes les actions sont placées.'});
  acts.filter(ac=>ac.must).forEach(ac=>{const h=p[ac.id];const ok=ac.must==='t1'?h==='t1':(h==='t1'||h==='t2');out.push({ok,t:`« ${ac.t.slice(0,60)}${ac.t.length>60?'…':''} » : ${ac.must==='t1'?'à placer entre 0 et 3 mois':'à placer avant 12 mois'}.`});});
  const kept=acts.filter(ac=>p[ac.id]&&p[ac.id]!=='no').length;
  out.push({ok:kept>=6,t:`Au moins 6 actions retenues (${kept} pour l’instant).`});
  NEED_CATS.forEach(n=>{const ok=acts.some(ac=>ac.cat===n.cat&&p[ac.id]&&p[ac.id]!=='no');out.push({ok,t:`Retiens ${n.msg}.`});});
  return out;
}
function renderRoadmap(st){
  const a=A(st.id),locked=!!a.done,p=(a.pick=a.pick||{});
  const acts=roadmapActions();
  const rows=acts.map(ac=>{
    const must=ac.must?`<p class="hint"><b>Obligatoire dans ton chemin.</b> ${esc(ac.why)}</p>`:'';
    return `<div class="act ${ac.must?'must':''} ${locked?'locked':''}"><div class="cat">${esc(ac.cat)}</div><div class="t">${esc(ac.t)}</div>${must}<div class="seg" role="group" aria-label="Horizon de : ${esc(ac.t)}">${HORIZONS.map(h=>`<button data-act="hz" data-step="${st.id}" data-key="${ac.id}" data-val="${h.id}" aria-pressed="${p[ac.id]===h.id}">${h.t}</button>`).join('')}</div></div>`;}).join('');
  const checks=roadmapChecks(a);
  const list=`<ul class="checks" id="rmchecks">${checks.map(c=>`<li class="${c.ok?'ok':''}">${esc(c.t)}</li>`).join('')}</ul>`;
  const after=locked?`<div class="box ok"><h3>Effets de ta feuille de route</h3>${deltaChips(D.per[st.id])}<p class="hint">Les actions placées tôt pèsent plus que les actions lointaines.</p></div>`:'';
  return `${chipsFor(st)}<h1>Construis ta feuille de route</h1><p class="lead">Place chaque action dans le temps. Certaines sont obligatoires à cause de tes choix précédents. Tiens compte de la sobriété numérique, de l’accompagnement social et de la qualité de vie et des conditions de travail.</p>${objLine(5)}
  <div class="box"><h3>Ce que ta feuille de route doit montrer</h3>${list}</div>${rows}${justifBox(st,a,locked,'Pourquoi cet ordre ? Qu’est-ce qui ne peut pas attendre ?',JUST.roadmap)}${after}${locked?navBar(st,D):commitZone(st,false,'Valider ma feuille de route')}`;
}

/* ----- synthèse ----- */
const SYN_FIELDS=[
 {k:'diag',t:'Mon diagnostic en quelques phrases',min:40,ph:'Sur mon périmètre, l’IA apporte… mais…'},
 {k:'opp',t:'Les opportunités que je retiens, et pourquoi',min:25,ph:''},
 {k:'risk',t:'Les risques que je traite en priorité, et comment',min:25,ph:''},
 {k:'hum',t:'Ce qui reste une décision humaine',min:20,ph:''},
 {k:'learn',t:'Ce que mes décisions m’ont appris, et ce que je ferais autrement',min:25,ph:''}
];
function pathSummary(){
  const f=D.flags,ul=usagesList(),a2=S.ans.d2&&S.ans.d2.pick||{};
  const opp=ul.filter(u=>a2[u.id]==='adopt'||a2[u.id]==='pilote').map(u=>`${u.t} (${a2[u.id]==='pilote'?'pilote':'adopté'}) : ${u.gain}`);
  const risk=[];
  ul.forEach(u=>{if(retained(u)&&u.ref==='interdit')risk.push(`${u.t} : pratique interdite retenue.`);if(retained(u)&&u.ref==='haut')risk.push(`${u.t} : usage à haut risque, obligations à partir du 2 décembre 2027.`);});
  if(f.has('data:reelles'))risk.push('Données réelles dans un outil grand public.');
  if(f.has('biais:aucun'))risk.push('Aucune vérification des biais.');
  if(f.has('transp:rien')||f.has('transp:interne'))risk.push('Information des personnes insuffisante.');
  if(f.has('cse:apres')||f.has('cse:non'))risk.push('Consultation du CSE tardive ou absente.');
  if(f.has('sanction'))risk.push('Au moins une décision qui expose à une sanction.');
  const hum=ul.map(u=>`${u.t} : ${u.humain}`);
  return {opp,risk,hum};
}
function renderSynthese(st){
  const a=A(st.id);a.fields=a.fields||{};const sm=pathSummary();
  const li=arr=>arr.length?'<ul>'+arr.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>':'<p class="hint">Rien à signaler.</p>';
  const fields=SYN_FIELDS.map(f=>{const v=a.fields[f.k]||'';const n=wc(v);return `<div class="field"><label for="f-${f.k}">${esc(f.t)}</label><textarea id="f-${f.k}" data-field="syn" data-key="${f.k}" data-step="${st.id}" placeholder="${esc(f.ph)}">${esc(v)}</textarea><div class="count ${n>=f.min?'ok':''}" id="cf-${f.k}">${n} mot${n>1?'s':''} sur ${f.min} au minimum</div></div>`;}).join('');
  const notTaken=[];
  STEPS.forEach(s2=>{const x=S.ans[s2.id];if(!x||!x.done)return;
    if(s2.kind==='scene'){const sc=sceneOf(s2);sc.opts.filter(o=>o.id!==x.choice).forEach(o=>notTaken.push([sc.t,o.t,o.csq]));}
    if(s2.kind==='garde'){GARDE.forEach(g=>g.opts.filter(o=>o.id!==(x.pick||{})[g.id]).forEach(o=>notTaken.push([g.q,o.t,o.csq])));}
    if(s2.kind==='perimetre'){PERIMETRES.filter(q=>q.id!==x.choice).forEach(q=>notTaken.push(['Périmètre',q.t,q.enjeu]));}
  });
  const ind=D.ind;
  const verdict=(()=>{const l=ind.legal,c=ind.conf;if(l>=70&&c>=65)return ['ok','Ton chemin est solide : le cadre légal et la confiance tiennent. Prépare-toi à défendre ce que tu as sacrifié en gain attendu.'];if(l>=45)return ['warn','Ton chemin est fragile : des décisions te exposent. Sois prêt(e) à dire lesquelles tu corrigerais en premier.'];return ['bad','Ton chemin expose fortement l’organisation. Défends ce diagnostic en expliquant comment tu sortirais de cette situation.'];})();
  return `${chipsFor(st)}<h1>Diagnostic et défense</h1><p class="lead">Tu présentes ce que ton chemin révèle : opportunités, risques, plan d’action. Les blocs ci-dessous viennent de tes décisions. Tu les complètes avec tes mots.</p>${objLine(6)}
  <div class="box ${verdict[0]}"><h3>Lecture de ton chemin</h3><p>${esc(verdict[1])}</p></div>
  <div class="box"><h3>Ce que ton parcours met en évidence</h3><h4>Opportunités</h4>${li(sm.opp)}<h4>Risques</h4>${li(sm.risk)}<h4>Ce qui reste humain</h4>${li(sm.hum)}</div>
  ${fields}
  <details><summary>Chemins non pris (ce qui se serait passé)</summary><table class="simple"><tr><th>Décision</th><th>Option non retenue</th><th>Conséquence</th></tr>${notTaken.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</table></details>
  <div class="box info"><h3>Ta défense orale en 3 minutes</h3><ol><li>Ton périmètre et son enjeu (30 secondes).</li><li>Deux opportunités que tu retiens (45 secondes).</li><li>Deux risques et ta réponse (1 minute).</li><li>Ton plan en trois horizons (30 secondes).</li><li>Ce qui reste une décision humaine (15 secondes).</li></ol></div>
  <div class="nav"><button class="btn" data-act="exportJson">Enregistrer le fichier de projet</button><button class="btn primary" data-act="exportPdf">Exporter en PDF</button></div>
  ${a.done?'<div class="box ok"><p><b>Diagnostic validé.</b> Exporte tes fichiers pour les déposer sur le LMS.</p></div>':commitZone(st,false,'Valider mon diagnostic')}${navBar(st,D)}`;
}

/* ----- rendu général ----- */
function renderStage(){
  const st=stepById(S.cur);let h='';
  if(st.kind==='accueil')h=renderAccueil(st);
  else if(st.kind==='mission')h=renderMission(st);
  else if(st.kind==='perimetre')h=renderChoice(st,{title:'Choisis ton périmètre RH',intro:'Ton diagnostic final portera sur un seul périmètre. Ce choix décide des usages que tu devras analyser : deux périmètres, deux chemins différents.',q:'Sur quel périmètre veux-tu travailler ?',opts:PERIMETRES.map(q=>({id:q.id,t:q.t,d:q.d+' '+q.enjeu,csq:q.enjeu})),jl:'Pourquoi ce périmètre ? Qu’espères-tu y comprendre ?',min:JUST.perimetre});
  else if(st.kind==='scene'){const sc=sceneOf(st);h=renderChoice(st,{title:sc.t,intro:sc.intro,q:sc.q,opts:sc.opts,jl:'Pourquoi cette décision ?',min:JUST.scene,obj:sc.obj});}
  else if(st.kind==='usages')h=renderUsages(st);
  else if(st.kind==='garde')h=renderGarde(st);
  else if(st.kind==='roadmap')h=renderRoadmap(st);
  else if(st.kind==='synthese')h=renderSynthese(st);
  const el=$('#stage');el.innerHTML=fr(`<div class="card ${isDone(st)&&st.kind!=='mission'&&st.kind!=='synthese'?'locked':''}">${h}</div>`);
}
function renderRail(){
  const vis=D.visible,open=openableIndex(vis);
  $('#rail-list').innerHTML=fr(CHAPS.map(c=>{
    const items=vis.map((s,i)=>({s,i})).filter(x=>x.s.chap===c.id);
    if(!items.length)return '';
    return `<div class="chap"><div class="chap-title">${esc(c.t)}</div><ol>${items.map(({s,i})=>{
      const done=isDone(s),cur=s.id===S.cur,locked=i>open;
      const cls=done?'done':(s.scene&&!locked?'new':'');
      return `<li><button class="step-link" data-act="goto" data-step="${s.id}" ${cur?'aria-current="step"':''} ${locked?'disabled':''}><span class="dot ${cls}"></span><span>${esc(titleOf(s))}</span></button></li>`;}).join('')}</ol></div>`;}).join(''));
}
function laneOf(st,a){
  if(st.kind==='perimetre')return Math.max(0,PERIMETRES.findIndex(q=>q.id===a.choice));
  if(st.kind==='scene')return Math.max(0,sceneOf(st).opts.findIndex(o=>o.id===a.choice));
  if(st.kind==='usages'){const p=a.pick||{};const ul=usagesList();if(st.mode==='adopt')return Math.min(3,ul.filter(u=>p[u.id]==='adopt'||p[u.id]==='pilote').length);if(st.mode==='human'){const rank={propose:0,controle:1,seule:2};return Math.max(0,...Object.values(p).map(v=>rank[v]||0));}return Math.min(3,ul.filter(u=>p[u.id]&&p[u.id]!==u.ref).length);}
  if(st.kind==='garde'){const p=a.pick||{};let s=0;GARDE.forEach(g=>{s+=Math.max(0,g.opts.findIndex(o=>o.id===p[g.id]));});return Math.min(3,Math.round(s/2));}
  if(st.kind==='roadmap'){const p=a.pick||{};return Math.min(3,Object.values(p).filter(v=>v==='t1').length>5?0:Object.values(p).filter(v=>v==='no').length>3?3:1);}
  return 1;
}
function renderPath(){
  const nodes=D.visible.filter(s=>['perimetre','usages','garde','scene','roadmap'].includes(s.kind));
  const W=Math.max(300,nodes.length*40+24),H=104;let pts=[],dots='';
  nodes.forEach((s,i)=>{const a=S.ans[s.id];const x=22+i*40;
    if(a&&a.done){const y=18+laneOf(s,a)*22;const f=D.per[s.id]||{};const net=Object.values(f).reduce((q,v)=>q+v,0);const col=net>=4?'#059669':net<=-8?'#B91C1C':'#B45309';pts.push([x,y]);dots+=`<circle cx="${x}" cy="${y}" r="7" fill="${col}"><title>${esc(titleOf(s))}</title></circle>`;}
    else dots+=`<circle cx="${x}" cy="52" r="6" fill="#fff" stroke="#CBD5E1" stroke-width="2"><title>${esc(titleOf(s))} (à venir)</title></circle>`;});
  const line=pts.length>1?`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-linejoin="round"/>`:'';
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Carte de ton chemin : chaque point est une décision, sa hauteur dépend de ton choix">${line}${dots}</svg>`;
}
function renderDash(){
  const g=IND.map(i=>{const v=D.ind[i.k];const c=v>=60?'':v>=40?'mid':'low';return `<div class="gauge" title="${esc(i.d)}"><div class="lab">${esc(i.t)} <span>${v}/100</span></div><div class="track"><div class="fill ${c}" style="width:${v}%"></div></div></div>`;}).join('');
  const j=[];STEPS.forEach(s=>{const a=S.ans[s.id];if(!a||!a.done||s.kind==='mission'||s.kind==='accueil')return;j.push({s,a});});
  const jr=j.slice().reverse().map(({s,a})=>{let sum='';
    if(s.kind==='perimetre')sum=(PERIMETRES.find(q=>q.id===a.choice)||{}).t;
    else if(s.kind==='scene')sum=(sceneOf(s).opts.find(o=>o.id===a.choice)||{}).t;
    else if(s.kind==='usages'){const c=Object.values(a.pick||{});sum=s.mode==='adopt'?`${c.filter(x=>x==='adopt').length} adopté(s), ${c.filter(x=>x==='pilote').length} en pilote, ${c.filter(x=>x==='refuse').length} refusé(s)`:s.mode==='human'?'Modes de décision choisis':'Qualifications saisies';}
    else if(s.kind==='garde')sum='Quatre garde-fous fixés';else if(s.kind==='roadmap')sum='Feuille de route validée';else sum='Diagnostic validé';
    return `<li><b>${esc(titleOf(s))}</b>${esc(sum||'')}</li>`;}).join('');
  $('#dash').innerHTML=fr(`<section><h2>Tes indicateurs</h2>${g}<p class="hint">Chaque décision les fait bouger. Passe la souris sur un titre pour lire sa définition.</p></section><section><h2>Ton chemin</h2><div class="path">${renderPath()}</div><p class="hint">Chaque point est une décision. Sa hauteur dépend de ton choix : un autre choix, un autre tracé.</p></section><section><h2>Journal de tes décisions</h2>${jr?`<ul class="journal">${jr}</ul>`:'<p class="hint">Tes décisions apparaîtront ici.</p>'}</section>`);
}
function renderBar(){
  const jt=fmtTime(S.meta.lastJson),pt=fmtTime(S.meta.lastPdf);
  const warn=S.meta.changes>0;
  $('#status').innerHTML=fr(`<span>${storageOK?'Enregistré sur cet appareil à <b>'+(fmtTime(S.meta.updated)||'')+'</b>':'<span class="warn">Stockage du navigateur indisponible : exporte un fichier.</span>'}</span><span>Fichier de projet : ${jt?'<b>'+jt+'</b>':'<span class="warn">jamais enregistré</span>'}${warn&&jt?' <span class="warn">('+S.meta.changes+' changement'+(S.meta.changes>1?'s':'')+' depuis)</span>':''}</span><span>PDF : ${pt?'<b>'+pt+'</b>':'jamais'}</span>`);
}
function render(){
  D=derive();
  if(!D.visible.find(s=>s.id===S.cur))S.cur=D.visible[0].id;
  renderBar();renderRail();renderStage();renderDash();persist();
}
function go(id){S.cur=id;render();window.scrollTo({top:0});}

/* ===== Actions, exports, raccourcis ===== */
const IS_MAC=/Mac|iPhone|iPad/.test(navigator.platform||'');
function rerender(){const y=window.scrollY;render();window.scrollTo(0,y);}

function ask(title,body,buttons){
  return new Promise(res=>{
    const d=$('#dlg');
    d.innerHTML=fr(`<h2>${esc(title)}</h2><p>${esc(body)}</p><div class="nav">${buttons.map((b,i)=>`<button class="btn ${b.cls||''}" data-v="${i}">${esc(b.t)}</button>`).join('')}</div>`);
    const onClick=e=>{const b=e.target.closest('button[data-v]');if(!b)return;d.removeEventListener('click',onClick);d.close();res(buttons[+b.dataset.v].v);};
    d.addEventListener('click',onClick);
    d.addEventListener('cancel',()=>{d.removeEventListener('click',onClick);res(null);},{once:true});
    if(d.showModal)d.showModal();else d.setAttribute('open','');
  });
}

function copyText(text,btn){
  const done=()=>{if(btn){const o=btn.textContent;btn.textContent='Copié';setTimeout(()=>btn.textContent=o,1600);}toast('Texte copié : colle-le avec Ctrl+V.');};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(done,()=>fallback());}else fallback();
  function fallback(){const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy');done();}catch(e){toast('Copie impossible : sélectionne le texte à la main.');}t.remove();}
}

/* ----- fichier de projet (.json) ----- */
function fileBase(){
  const p=((A('accueil').pseudo||'projet')+'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'projet';
  return `budget-formation-${p}-${new Date().toISOString().slice(0,10)}`;
}
function exportJson(){
  S.meta.lastJson=Date.now();S.meta.changes=0;persist();
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fileBase()+'.json';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  render();toast('Fichier de projet enregistré dans tes téléchargements.');
}
function importJson(file){
  const r=new FileReader();
  r.onload=async()=>{
    let o;try{o=JSON.parse(r.result);}catch(e){toast('Ce fichier n’est pas lisible.');return;}
    if(!o||o.app!==APPID||!o.ans||typeof o.v!=='number'){toast('Ce fichier n’est pas un projet de ce parcours.');return;}
    if(o.v>VERSION){toast('Ce fichier vient d’une version plus récente de la page.');return;}
    const hasWork=Object.keys(S.ans).length>1;
    if(hasWork){const c=await ask('Remplacer le projet en cours ?','Le projet de cet appareil sera remplacé par celui du fichier. Enregistre-le d’abord si tu veux le garder.',[{t:'Annuler',v:'no'},{t:'Remplacer',v:'yes',cls:'primary'}]);if(c!=='yes')return;}
    o.meta=Object.assign({created:Date.now(),updated:Date.now(),lastJson:0,lastPdf:0,changes:0},o.meta||{});o.cur=o.cur||'accueil';
    S=o;render();toast('Projet chargé.');
  };
  r.readAsText(file);
}
async function newProject(){
  const c=await ask('Nouveau projet','Ton travail actuel sera effacé de cet appareil. Enregistre d’abord un fichier de projet si tu veux le garder.',[{t:'Annuler',v:'no'},{t:'Enregistrer le fichier d’abord',v:'save'},{t:'Effacer et recommencer',v:'new',cls:'primary'}]);
  if(c==='save')exportJson();
  if(c==='new'){S=fresh();render();window.scrollTo(0,0);toast('Nouveau projet créé.');}
}

/* ----- rapport PDF (via la fenêtre d'impression du navigateur) ----- */
function describe(st,a){
  const out={choix:'',csq:'',extra:''};
  if(st.kind==='perimetre'){const q=PERIMETRES.find(x=>x.id===a.choice);out.choix=q?q.t:'';out.csq=q?q.enjeu:'';}
  else if(st.kind==='scene'){const o=sceneOf(st).opts.find(x=>x.id===a.choice);out.choix=o?o.t:'';out.csq=o?o.csq:'';}
  else if(st.kind==='garde'){out.extra='<ul>'+GARDE.map(g=>{const o=g.opts.find(x=>x.id===(a.pick||{})[g.id]);return `<li><b>${esc(g.q)}</b> ${esc(o?o.t:'')}. ${esc(o?o.csq:'')}</li>`;}).join('')+'</ul>';}
  else if(st.kind==='usages'){
    const ul=usagesList();
    if(st.mode==='adopt')out.extra='<ul>'+ul.map(u=>`<li><b>${esc(u.t)}</b> : ${esc((USAGE_CHOICES.find(c=>c.id===(a.pick||{})[u.id])||{}).t||'')}</li>`).join('')+'</ul>';
    if(st.mode==='human')out.extra='<ul>'+ul.filter(u=>(a.pick||{})[u.id]).map(u=>`<li><b>${esc(u.t)}</b> : ${esc((HUMAN_MODES.find(c=>c.id===a.pick[u.id])||{}).t||'')}</li>`).join('')+'</ul>';
    if(st.mode==='qualif')out.extra='<table><tr><th>Usage</th><th>Ma qualification</th><th>Référence</th><th>Explication</th></tr>'+ul.map(u=>{const m=(QUALIF_LEVELS.find(c=>c.id===(a.pick||{})[u.id])||{}).t||'';return `<tr><td>${esc(u.t)}</td><td>${esc(m)}</td><td>${esc(REFS[u.ref])}</td><td>${esc(u.why)}</td></tr>`;}).join('')+'</table>';
  }
  else if(st.kind==='roadmap'){
    out.extra=HORIZONS.map(h=>{const l=roadmapActions().filter(ac=>(a.pick||{})[ac.id]===h.id);return `<h3>${esc(h.t)}</h3>${l.length?'<ul>'+l.map(ac=>`<li>${esc(ac.cat)} : ${esc(ac.t)}</li>`).join('')+'</ul>':'<p>Aucune action.</p>'}`;}).join('');
  }
  return out;
}
function buildReport(){
  D=derive();
  const a0=A('accueil'),per=PERIMETRES.find(q=>q.id===perimetreId());
  const date=new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
  let h=`<h1>Budget formation : mon parcours</h1><p><b>${esc(a0.pseudo||'Sans pseudo')}</b>. Exporté le ${esc(date)}.</p><p>Périmètre RH : <b>${esc(per?per.t:'non choisi')}</b>.</p>`;
  h+=`<h2>Mes indicateurs</h2><table>${IND.map(i=>`<tr><td>${esc(i.t)}</td><td>${D.ind[i.k]} sur 100</td><td><span class="bar-i" style="width:${D.ind[i.k]*1.4}px"></span></td></tr>`).join('')}</table>`;
  h+='<h2>Mes décisions</h2>';
  D.visible.forEach(st=>{const a=S.ans[st.id];if(!a||!a.done||['accueil','mission'].includes(st.kind))return;
    const d=describe(st,a);
    h+=`<div class="blk"><h3>${esc(titleOf(st))}${st.obj||st.scene?` (objectif ${st.obj||sceneOf(st).obj})`:''}</h3>`;
    if(d.choix)h+=`<p><b>Mon choix :</b> ${esc(d.choix)}</p>`;
    if(d.csq)h+=`<p><b>Conséquence :</b> ${esc(d.csq)}</p>`;
    h+=d.extra;
    if(a.justif)h+=`<p><b>Ma justification :</b> ${esc(a.justif)}</p>`;
    const f=D.per[st.id];if(f&&st.kind!=='perimetre')h+=`<p><b>Effets :</b> ${IND.map(i=>`${SHORT[i.k]} ${Math.round(f[i.k]||0)>0?'+':''}${Math.round(f[i.k]||0)}`).join(' ; ')}</p>`;
    h+='</div>';});
  const used=new Set();['d4','d5'].forEach(id=>{(S.ans[id]&&S.ans[id].sources||[]).forEach(x=>used.add(x));});
  if(used.size)h+=`<h2>Sources que j’ai consultées</h2><ul>${[...used].map(id=>`<li>${esc(SRC[id].t)} : ${esc(SRC[id].u)}</li>`).join('')}</ul>`;
  const syn=S.ans.d7&&S.ans.d7.fields||{};
  if(Object.keys(syn).length){h+='<h2>Mon diagnostic</h2>'+SYN_FIELDS.map(f=>`<div class="blk"><h3>${esc(f.t)}</h3><p>${esc(syn[f.k]||'')}</p></div>`).join('');}
  const rules=rulesFromPath(D.flags);
  h+=`<h2>Règles de gestion pour mon application</h2><ul>${rules.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>`;
  h+=`<h2>Pour reprendre ce travail</h2><p>Ouvre la page du parcours, clique sur « Ouvrir » et choisis le fichier de projet (.json) enregistré avec ce rapport. Ce PDF se lit mais ne se recharge pas.</p><p><i>Parcours pédagogique. Données fictives uniquement. Les références juridiques sont des synthèses : vérifie-les sur les textes officiels.</i></p>`;
  return h;
}
function exportPdf(){
  const root=$('#print-root');root.innerHTML=fr(buildReport());
  const old=document.title;document.title=fileBase();
  S.meta.lastPdf=Date.now();persist();
  const after=()=>{document.title=old;root.innerHTML='';window.removeEventListener('afterprint',after);render();};
  window.addEventListener('afterprint',after);
  toast('Dans la fenêtre qui s’ouvre, choisis « Enregistrer au format PDF ».');
  setTimeout(()=>window.print(),350);
}

/* ----- évènements ----- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,sid=b.dataset.step,st=sid?stepById(sid):null,a=sid?A(sid):null;
  if(act==='goto'){if(!b.disabled)go(sid);}
  else if(act==='pick1'){if(a.done)return;a.choice=b.dataset.val;rerender();}
  else if(act==='pickU'||act==='pickG'||act==='hz'){if(a.done)return;a.pick=a.pick||{};a.pick[b.dataset.key]=b.dataset.val;rerender();}
  else if(act==='commit'){
    if(a.done)return;if(unmet(st).length)return;
    a.done=true;a.ts=Date.now();S.meta.changes++;
    if(st.kind==='accueil'){const vis=derive().visible;S.cur=vis[1].id;render();window.scrollTo(0,0);}
    else{render();window.scrollTo(0,0);toast('Décision validée. Pense à enregistrer ton fichier (Ctrl + S).');}
  }
  else if(act==='copy'){copyText(decodeURIComponent(b.dataset.text),b);}
  else if(act==='open'){$('#file').click();}
  else if(act==='exportJson'){exportJson();}
  else if(act==='exportPdf'){exportPdf();}
  else if(act==='new'){newProject();}
});
document.addEventListener('change',e=>{
  const t=e.target;if(t.id==='file'){if(t.files[0])importJson(t.files[0]);t.value='';return;}
  const act=t.dataset&&t.dataset.act;if(!act)return;
  const a=A(t.dataset.step);
  if(act==='chk'){
    a.checks=a.checks||{};a.checks[t.dataset.val]=t.checked;
    const st=stepById(t.dataset.step);const m=st.id==='m4'?buildM4():MISSIONS[st.id];
    if(!a.done&&m.steps.every(s=>a.checks[s.id])&&a.checks.ctrl){a.done=true;S.meta.changes++;toast('Mission terminée.');}
    rerender();
  }
  else if(act==='src'){if(a.done)return;a.sources=a.sources||[];const v=t.dataset.val;a.sources=t.checked?[...new Set([...a.sources,v])]:a.sources.filter(x=>x!==v);persist();refreshCommit(stepById(t.dataset.step));}
});
document.addEventListener('input',e=>{
  const t=e.target,f=t.dataset&&t.dataset.field;if(!f)return;
  const st=stepById(t.dataset.step||'accueil'),a=A(st.id);
  if(f==='justif'){a.justif=t.value;}
  else if(f==='pseudo'){A('accueil').pseudo=t.value;}
  else if(f==='syn'){a.fields=a.fields||{};a.fields[t.dataset.key]=t.value;const def=SYN_FIELDS.find(x=>x.k===t.dataset.key),n=wc(t.value);const c=$('#cf-'+t.dataset.key);if(c){c.textContent=`${n} mot${n>1?'s':''} sur ${def.min} au minimum`;c.className='count '+(n>=def.min?'ok':'');}}
  persist();
  if(f==='pseudo')refreshCommit(stepById('accueil'));else refreshCommit(st);
});
document.addEventListener('keydown',e=>{
  const mod=e.ctrlKey||e.metaKey;const k=(e.key||'').toLowerCase();
  if(mod&&!e.altKey&&k==='s'){e.preventDefault();exportJson();}
  else if(mod&&!e.altKey&&k==='e'){e.preventDefault();exportPdf();}
  else if(e.altKey&&e.code==='KeyN'){e.preventDefault();newProject();}
  else if(e.altKey&&e.code==='KeyO'){e.preventDefault();$('#file').click();}
});

/* ----- démarrage ----- */
(function init(){
  const saved=load();if(saved){S=saved;S.meta=Object.assign({created:Date.now(),updated:Date.now(),lastJson:0,lastPdf:0,changes:0},S.meta||{});}
  document.querySelectorAll('[data-mac]').forEach(el=>{el.textContent=IS_MAC?el.dataset.mac:el.dataset.pc;});
  render();
})();

</script>
